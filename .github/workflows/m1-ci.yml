name: M1 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-manifest:
    name: build-test-manifest
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show pinned environment
        run: |
          uname -m
          xcodebuild -version
          swift --version
          python3 --version

      - name: Run blocking build, test, and manifest gates
        run: make verify REPORT=artifacts/ci/m1-008-report.json

      - name: Upload machine-readable gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-ci-report-${{ github.run_id }}
          path: artifacts/ci/m1-008-report.json
          if-no-files-found: error
          retention-days: 14
